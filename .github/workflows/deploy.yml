name: Deploy to GitHub Pages

# The legacy docs site was removed in overhaul M0. The Astro site (M6a) restores
# the site build and the Pages steps; deploys move to v* tags (D32, M5).

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm

      - run: npm install
      - run: npm run build
