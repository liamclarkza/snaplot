name: Publish & Release

# Single entry point driven by version tags (scripts/release.sh). A `vX.Y.Z` or `vX.Y.Z-beta.N`
# push runs:
#   1. ci: the full CI workflow (every blocking gate).
#   2. verify: the tag matches package.json and the version pattern; the package, size and API
#      gates (G5-G7) again on this exact build; the matching CHANGELOG section; the packed
#      tarball as an artifact.
#   3. publish-npm: npm publish of that tarball with OIDC provenance, `--tag next` for a
#      prerelease (D1) and `latest` otherwise, scoped to the `npm` environment so npm's
#      trusted-publisher config can pin it and the publish shows up as a Deployment.
#   4. release: a GitHub Release (marked prerelease for -beta.N) with the extracted changelog as
#      body and the tarball as an asset.
#
# Nothing publishes if ci or verify fails; no Release is created if publish fails.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist-tag: ${{ steps.meta.outputs.dist-tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: meta
        name: Verify the tag, the version and the release channel
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          PKG=$(node -p "require('./packages/snaplot/package.json').version")
          if [[ "$PKG" != "$VER" ]]; then
            echo "::error::Tag $TAG does not match packages/snaplot/package.json ($PKG)"
            exit 1
          fi
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::$VER is not X.Y.Z or X.Y.Z-beta.N"
            exit 1
          fi
          if [[ "$VER" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build library
        run: npm run build

      - name: Package, size and API gates (G5-G7)
        run: |
          npm run check:package
          npm run check:size
          npm run check:api

      - name: Extract matching CHANGELOG section
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.VER;
            const s = fs.readFileSync('CHANGELOG.md', 'utf8');
            const header = '## [' + v + ']';
            const idx = s.indexOf(header);
            if (idx === -1) {
              console.error('No CHANGELOG entry for ' + v);
              process.exit(1);
            }
            const rest = s.slice(idx + header.length);
            const next = rest.search(/^## \[/m);
            const body = next === -1 ? rest : rest.slice(0, next);
            fs.writeFileSync('release-notes.md', body.trim() + '\n');
          "
          echo "::group::release-notes.md"
          cat release-notes.md
          echo "::endgroup::"

      # The tarball that is published: npm pack runs prepack, which copies README and LICENSE in.
      - name: Pack
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          npm pack -w packages/snaplot --pack-destination .
          mv "snaplot-${VER}.tgz" "snaplot-v${VER}.tgz"
          tar -tzf "snaplot-v${VER}.tgz" | sort

      - uses: actions/upload-artifact@v7
        with:
          name: publish-bundle
          path: |
            snaplot-v${{ steps.meta.outputs.version }}.tgz
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    # Pin to the `npm` environment so npm's trusted-publisher config
    # scopes OIDC to exactly this job. Surfaces each publish as a
    # GitHub Deployment with a link to the new npm version.
    environment:
      name: npm
      url: https://www.npmjs.com/package/snaplot/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          name: publish-bundle

      - name: Publish to npm
        env:
          VER: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: npm publish "snaplot-v${VER}.tgz" --provenance --access public --tag "$DIST_TAG"

  release:
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: publish-bundle

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: snaplot-v${{ needs.verify.outputs.version }}.tgz
          draft: false
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          generate_release_notes: false
