name: Update visual snapshots

# Maintainer tool (plan §11.3 G10): regenerates the Linux visual baselines in the same pinned
# Playwright image as CI's visual job, on the branch it is dispatched from. The screenshots and
# the HTML report are uploaded for review; with `commit` set, the new baselines are also
# committed and pushed to that branch. Use it when local baselines came from another platform.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit and push the regenerated baselines to this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate Linux baselines
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Regenerate the baselines
        run: npx playwright test --project visual --update-snapshots
        working-directory: packages/snaplot
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: |
            packages/snaplot/**/__screenshots__/**
            packages/snaplot/playwright-report/
          if-no-files-found: error
          retention-days: 14
      - name: Commit the baselines
        if: inputs.commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'packages/snaplot/**/__screenshots__/**'
          if git diff --cached --quiet; then
            echo 'The baselines are unchanged.'
            exit 0
          fi
          git commit -m 'test(visual): refresh Linux baselines' -m 'Regenerated by the update-snapshots workflow.'
          git push
