# Pre-commit quality gates. Bypass only with --no-verify and explain why.
# See https://lefthook.dev for syntax.

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{js,mjs,cjs,ts,mts,cts,tsx,jsx,json,jsonc,css}'
      # --staged runs against the git index, matching what will be committed.
      # --no-errors-on-unmatched silently skips commits that touch only
      # files biome ignores (e.g. markdown-only changes).
      run: npx biome check --staged --no-errors-on-unmatched

    - name: typecheck
      # `**/` needs at least one directory here, so each tree also lists its
      # top-level files (src/index.ts, test/golden-api.test.ts).
      glob:
        - 'packages/snaplot/src/*.{ts,tsx}'
        - 'packages/snaplot/src/**/*.{ts,tsx}'
        - 'packages/snaplot/test/*.{ts,tsx}'
        - 'packages/snaplot/test/**/*.{ts,tsx}'
        - 'packages/snaplot/tsconfig*.json'
      # tsc runs against the whole project, so we only invoke it when a
      # library source file, a test or a tsconfig changed (test-only commits
      # are type-checked too: tsconfig.test.json covers test/).
      run: npm run typecheck

pre-push:
  jobs:
    - name: test
      run: npm test
